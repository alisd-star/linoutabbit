<style>
/* Layout: one phone column. Brand bar, day header with rings, week strip, 4 tabs, cards. Bottom sheets for passages, hizb, settings. Gold = brand, green = done, orange = minimum, red = below minimum. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --surface-2: #E1E8E3;
  --fg: #14211B;
  --muted: #5B6C64;
  --line: #D1DBD5;
  --accent: #0F5A43;
  --on-accent: #FFFFFF;
  --brand: #04402F;
  --gold: #A9822B;
  --good: #1E9E57;
  --on-good: #FFFFFF;
  --warn: #D2830F;
  --danger: #C8372A;
  --c-rev: #16805B;
  --c-prof: #0E7C86;
  --c-wird: #7C55C0;
  --shadow: 0 1px 2px rgb(20 40 30 / .06), 0 12px 32px -14px rgb(20 40 30 / .28);
  --backdrop: rgb(10 20 15 / .42);
  --f-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ar: "Amiri", "Noto Naskh Arabic", "Geeza Pro", "Times New Roman", serif;
  --r-card: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --surface: #16201C; --surface-2: #22302A; --fg: #E5EEE9; --muted: #92A39B; --line: #2A3933;
    --accent: #4CBF8D; --on-accent: #08130E; --brand: #0B4A37; --gold: #E1B656; --good: #45D483; --on-good: #06210F; --warn: #F2AE45; --danger: #F2705C;
    --c-rev: #4CBF8D; --c-prof: #4CC3CC; --c-wird: #B594EA;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 14px 34px -14px rgb(0 0 0 / .7);
    --backdrop: rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #16201C; --surface-2: #22302A; --fg: #E5EEE9; --muted: #92A39B; --line: #2A3933;
  --accent: #4CBF8D; --on-accent: #08130E; --brand: #0B4A37; --gold: #E1B656; --good: #45D483; --on-good: #06210F; --warn: #F2AE45; --danger: #F2705C;
  --c-rev: #4CBF8D; --c-prof: #4CC3CC; --c-wird: #B594EA;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 14px 34px -14px rgb(0 0 0 / .7);
  --backdrop: rgb(0 0 0 / .6);
  color-scheme: dark;
}
/* Appearance chosen in the app (overrides the system theme) */
:root[data-look="light"] { --bg: #EDF1EE; --surface: #FFFFFF; --surface-2: #E1E8E3; --fg: #14211B; --muted: #5B6C64; --line: #D1DBD5;
  --accent: #0F5A43; --on-accent: #FFFFFF; --brand: #04402F; --gold: #A9822B; --good: #1E9E57; --on-good: #FFFFFF; --warn: #D2830F; --danger: #C8372A;
  --c-rev: #16805B; --c-prof: #0E7C86; --c-wird: #7C55C0;
  --shadow: 0 1px 2px rgb(20 40 30 / .06), 0 12px 32px -14px rgb(20 40 30 / .28);
  --backdrop: rgb(10 20 15 / .42); color-scheme: light; }
:root[data-look="pure"] { --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F4F3; --fg: #18201C; --muted: #6B746F; --line: #E3E7E5;
  --accent: #1D5B46; --on-accent: #FFFFFF; --brand: #04402F; --gold: #9C7A2A; --good: #2A9460; --on-good: #FFFFFF; --warn: #C7861C; --danger: #C0473B;
  --c-rev: #2B7A5E; --c-prof: #2F7C84; --c-wird: #7A62B0;
  --shadow: none; --backdrop: rgb(20 24 22 / .32); color-scheme: light; }
:root[data-look="dark"] { --bg: #0E1512; --surface: #16201C; --surface-2: #22302A; --fg: #E5EEE9; --muted: #92A39B; --line: #2A3933;
    --accent: #4CBF8D; --on-accent: #08130E; --brand: #0B4A37; --gold: #E1B656; --good: #45D483; --on-good: #06210F; --warn: #F2AE45; --danger: #F2705C;
    --c-rev: #4CBF8D; --c-prof: #4CC3CC; --c-wird: #B594EA;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 14px 34px -14px rgb(0 0 0 / .7);
    --backdrop: rgb(0 0 0 / .6); color-scheme: dark; }
:root[data-look="pure"] .goal, :root[data-look="pure"] .summary, :root[data-look="pure"] .grid, :root[data-look="pure"] .cal, :root[data-look="pure"] .stat, :root[data-look="pure"] .onb-card { border-color: var(--line); }
:root[data-look="pure"] .goal.full, :root[data-look="pure"] .goal.low, :root[data-look="pure"] .goal.ok { background: var(--surface); }
:root[data-look="pure"] .seg, :root[data-look="pure"] .mini-seg { background: var(--surface-2); }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding-block: 12px 60px; display: flex; flex-direction: column; gap: 16px; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; }
.ar-i { font-family: var(--f-ar); unicode-bidi: isolate; font-size: 1.12em; font-weight: 700; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }

/* Brand */
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 36px; height: 36px; border-radius: 9px; flex: none; }
.brand-t { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.brand-q { margin: -4px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; text-wrap: balance; }
.hij { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-ref { font-size: 10.5px; opacity: .8; white-space: nowrap; }
.q-fr { white-space: nowrap; }
.brand-q .ar { font-size: 13px; }
.wm { display: inline-flex; align-items: center; gap: 12px; line-height: 1; }
.wm-ar { font-family: "Noto Naskh Arabic", var(--f-ar); font-weight: 400; font-size: 25px; color: var(--fg); direction: rtl; unicode-bidi: isolate; line-height: 1.1; }
.wm-sep { width: 1.5px; height: 20px; border-radius: 2px; background: var(--muted); opacity: .6; flex: none; }
.wm-la { font-family: var(--f-display); font-weight: 500; font-size: 19px; color: var(--fg); }
.wm.lg { gap: 16px; }
.wm.lg .wm-ar { font-size: 40px; }
.wm.lg .wm-la { font-size: 27px; }
.wm.lg .wm-sep { height: 28px; }
.icon-btn { width: 36px; height: 36px; flex: none; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }

/* Header */
.top { display: flex; flex-direction: column; gap: 14px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-row > div:first-child { min-width: 0; }
.eyebrow { margin: 0 0 2px; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.eyebrow b { color: var(--accent); font-weight: 600; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
.top-row h1 { white-space: nowrap; font-size: 25px; overflow: hidden; }
.top-row > div:first-child { flex: 1; }
@media (max-width: 420px) { h1 { font-size: 23px; } }
.rings { display: flex; align-items: center; gap: 6px; flex: none; }
.ring { position: relative; width: 56px; height: 56px; flex: none; }
.ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 650; font-size: 14px; font-variant-numeric: tabular-nums; }
.ring.full span { color: var(--good); }
.ring.ok span { color: var(--warn); }
.ring.low span { color: var(--danger); }
.tah-chip { position: relative; width: 56px; height: 56px; padding: 0; border: 0; background: none; flex: none; border-radius: 50%; }
.tah-chip svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.tah-disc { position: absolute; inset: 7px; border-radius: 50%; background: var(--brand); color: #F6F1E4; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.tah-disc b { font-family: var(--f-display); font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tah-disc small { font-family: var(--f-ar); font-size: 10px; font-weight: 700; margin-top: 2px; color: #E1C27A; }
.tah-disc svg { width: 20px; height: 20px; transform: none; }
.tah-chip.soon .tah-disc { background: var(--warn); color: var(--surface); }
.tah-chip.soon .tah-disc small { color: var(--surface); }
.tah-chip.today .tah-disc { background: var(--good); }

.week-nav { display: flex; align-items: center; gap: 6px; }
.week-nav .lbl { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week-nav .lbl strong { color: var(--fg); font-weight: 600; }
.pill-btn { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--accent); }
.nav-btn { width: 34px; height: 34px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.nav-btn svg { width: 16px; height: 16px; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { border: 1px solid transparent; background: none; border-radius: 14px; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.day .wd { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.day .dn { position: relative; width: 36px; height: 36px; }
.day .dn svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.day .dn b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day .pdot { width: 4px; height: 4px; border-radius: 50%; background: var(--c-prof); }
.day .pdot.off { background: transparent; }
.day .pdot.tahd { background: var(--gold); width: 6px; height: 6px; }
.day.today .dn b, .day.today .wd { color: var(--accent); font-weight: 700; }
.day.low:not(.today) .dn b { color: var(--danger); }
.day.ok:not(.today) .dn b { color: var(--warn); }
.day.full .dn b { inset: 3px; border-radius: 50%; background: var(--good); color: var(--on-good) !important; }
.day.pause .dn b { color: var(--muted); }
.day.future { opacity: .55; }
.day.sel { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 9px 0; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

/* Sections and cards */
main { display: flex; flex-direction: column; gap: 20px; }
section { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2 { margin: 0; font-family: var(--f-display); font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
.sec-head > span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.note { margin: 0; padding: 14px; border: 1px dashed var(--line); border-radius: var(--r-card); color: var(--muted); font-size: 14px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; }
.banner > div { flex: 1; min-width: 0; }
.banner b { display: block; font-size: 14px; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.banner .btn { min-height: 38px; padding: 0 12px; font-size: 13.5px; flex: none; }
.banner.bk { flex-direction: column; align-items: stretch; gap: 10px; border-color: var(--accent); line-height: 1.45; }
.banner.bk small { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
.bk-row { display: flex; gap: 8px; margin-top: 8px; }
.bk-row .btn { flex: 1; }
.bk-copy { align-self: center; padding: 6px 12px; }
.bk-acts { display: flex; align-items: center; gap: 14px; }
.bk-acts .btn { flex: 1; }
.goal { --cat: var(--c-rev); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.goal.full { border-color: color-mix(in srgb, var(--good) 60%, var(--line)); background: color-mix(in srgb, var(--good) 7%, var(--surface)); }
.goal.low { border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); background: color-mix(in srgb, var(--danger) 4%, var(--surface)); }
.goal.ok { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.goal.rest { background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
.goal-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--cat); background: color-mix(in srgb, var(--cat) 13%, transparent); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cat); }
.tag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag.good { color: var(--good); font-weight: 600; }
.tag.red { color: var(--danger); font-weight: 600; }
.tag.warn { color: var(--warn); font-weight: 600; }
.goal h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.hz-now { display: flex; flex-direction: column; gap: 2px; }
.hz-now .ar { font-size: 30px; line-height: 1.45; font-weight: 700; text-align: right; }
.hz-now small { font-size: 13px; color: var(--muted); }
.sub { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--line); }
.sub > b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }
.pitem { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.pitem .ar { font-size: 17px; }
.pitem em { font-style: normal; font-weight: 700; }
.pts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.pts li { display: flex; gap: 8px; }
.pts li .ar { font-size: 15px; flex: none; color: var(--warn); }
.bar { position: relative; height: 6px; border-radius: 99px; background: var(--surface-2); }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--cat); max-width: 100%; transition: width .3s ease; }
.goal.full .bar i { background: var(--good); }
.meta { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { font-family: var(--f-display); font-size: 19px; font-weight: 650; color: var(--fg); }
.goal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ctrl { display: flex; gap: 6px; flex: none; }
.ctrl button { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; display: grid; place-items: center; }
.ctrl .inc { background: color-mix(in srgb, var(--cat) 14%, var(--surface)); border-color: color-mix(in srgb, var(--cat) 35%, var(--line)); color: var(--cat); }
.ctrl .check svg { width: 18px; height: 18px; }
.ctrl .check[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--on-good); }
.ctrl button:disabled, .btn:disabled { opacity: .35; cursor: not-allowed; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 140px; min-width: 0; }
.btn { min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.validate { background: var(--cat); border-color: var(--cat); color: var(--surface); }
.btn.soft { color: var(--cat); border-color: color-mix(in srgb, var(--cat) 40%, var(--line)); background: color-mix(in srgb, var(--cat) 8%, var(--surface)); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn:active:not(:disabled), .ctrl button:active:not(:disabled) { transform: scale(.97); }
.onb-restore { align-self: center; text-align: center; padding: 8px 12px; }
.link { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 13.5px; text-align: left; }
.win { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-card); background: var(--good); color: var(--on-good); animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.win svg { width: 30px; height: 30px; flex: none; padding: 5px; border-radius: 50%; background: color-mix(in srgb, var(--on-good) 22%, transparent); }
.win div { display: flex; flex-direction: column; min-width: 0; }
.win strong { font-family: var(--f-display); font-size: 18px; font-weight: 800; }
.win span { font-size: 13.5px; opacity: .9; }
.qr { display: flex; flex-direction: column; gap: 7px; padding-top: 10px; border-top: 1px dashed var(--line); }
.qr > span { font-size: 13px; color: var(--muted); }
.qr b { color: var(--fg); }
.rate { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.rate button { height: 40px; min-width: 0; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; color: var(--fg); }
.rate.sm button { height: 34px; border-radius: 9px; font-size: 13.5px; }
.qn { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 6px; }
.qn > span { font-size: 13px; font-weight: 600; color: var(--fg); }
.rate.xs { gap: 3px; } .rate.xs button { height: 30px; border-radius: 8px; font-size: 12.5px; }
.qn-done { justify-self: start; display: flex; gap: 8px; align-items: baseline; background: none; border: 0; padding: 4px 0; font: inherit; color: var(--fg); cursor: pointer; }
.qn-done small { color: var(--muted); text-decoration: underline; }
.rate button.on.l1 { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.rate button.on.l2 { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.rate button.on.l3, .rate button.on.l4 { background: var(--good); border-color: var(--good); color: var(--on-good); }
.l1-t { color: var(--danger); } .l2-t { color: var(--warn); } .l3-t, .l4-t { color: var(--good); }

/* Summary, grid, calendar */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; align-items: center; gap: 16px; }
.summary .ring { width: 72px; height: 72px; }
.summary .ring span { font-size: 18px; }
.summary > div:last-child { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.summary h2 { font-size: 20px; }
.summary p { margin: 0; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary p.red { color: var(--danger); }
.summary p.small { font-size: 12px; }
.grid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px; display: flex; flex-direction: column; }
.grow { --cat: var(--c-rev); display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 28px); gap: 4px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.grow.head { border-top: 0; padding-block: 2px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-align: center; }
.gname { min-width: 0; display: flex; flex-direction: column; }
.gname span { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gname small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { width: 28px; height: 28px; border-radius: 8px; border: 0; padding: 0; background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--muted); }
.cell.ok { background: color-mix(in srgb, var(--warn) 30%, var(--surface-2)); color: var(--fg); }
.cell.full { background: var(--good); color: var(--on-good); }
.cell.soft { background: color-mix(in srgb, var(--cat) 35%, var(--surface-2)); color: var(--fg); }
.cell.low { background: color-mix(in srgb, var(--danger) 24%, var(--surface-2)); color: var(--danger); }
.cell.future { background: transparent; border: 1px dashed var(--line); }
.cell.na, .cell.pause { background: transparent; color: var(--line); }
.cell.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 2px 2px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--surface-2); }
.legend i.o { background: color-mix(in srgb, var(--warn) 30%, var(--surface-2)); }
.legend i.f { background: var(--good); }
.legend i.l { background: color-mix(in srgb, var(--danger) 24%, var(--surface-2)); }
.legend i.z1 { background: var(--danger); } .legend i.z2 { background: var(--warn); } .legend i.z3 { background: color-mix(in srgb, var(--good) 35%, var(--surface-2)); } .legend i.z4 { background: var(--good); }
.legend i.zs { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav h2 { flex: 1; min-width: 0; text-align: center; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .h { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.mc { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 10px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; }
.mc.ok { background: color-mix(in srgb, var(--warn) 30%, var(--surface-2)); color: var(--fg); }
.mc.full { background: var(--good); color: var(--on-good); }
.mc.low { background: color-mix(in srgb, var(--danger) 24%, var(--surface-2)); color: var(--danger); }
.mc.future { background: transparent; border: 1px dashed var(--line); }
.mc.pause { background: transparent; border: 1px dotted var(--muted); }
.mc.today { box-shadow: inset 0 0 0 2px var(--accent); }
.mc.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.stats4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { --cat: var(--c-rev); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat b { font-family: var(--f-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--cat); }
.stat small { font-size: 12px; color: var(--muted); }

/* Hizb map */
.mini-seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); flex: none; }
.mini-seg button { border: 0; background: none; padding: 5px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.mini-seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.prio { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pchip { flex: none; display: flex; flex-direction: column; align-items: flex-start; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.pchip .ar { font-size: 20px; font-weight: 700; line-height: 1.4; }
.pchip b { font-family: var(--f-display); font-size: 15px; }
.pchip small { font-size: 11px; color: var(--warn); font-weight: 600; }
.pchip.l1 { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); } .pchip.l1 b { color: var(--danger); }
.pchip.l2 { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); } .pchip.l2 b { color: var(--warn); }
.hzgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.hz { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 10px 10px 9px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.hz-n { font-size: 12px; font-weight: 600; color: var(--muted); }
.hz-s { font-family: var(--f-display); font-size: 25px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; }
.hz-s small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.hz-s i { font-style: normal; font-size: 15px; margin-left: 4px; }
.hz-s i.up { color: var(--good); } .hz-s i.down { color: var(--danger); }
.hz-s.hz-empty { font-family: var(--f-body); font-size: 15px; font-weight: 600; color: var(--muted); padding-block: 5px 3px; }
.hz-meta, .hz-pg { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.hz-pg { color: var(--warn); font-weight: 600; }
.hz.none { border-style: dashed; }
.hz.l1 { background: color-mix(in srgb, var(--danger) 13%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); } .hz.l1 .hz-s { color: var(--danger); }
.hz.l2 { background: color-mix(in srgb, var(--warn) 15%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); } .hz.l2 .hz-s { color: var(--warn); }
.hz.l3 { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); } .hz.l3 .hz-s { color: var(--good); }
.hz.l4 { background: var(--good); border-color: var(--good); }
.hz.l4 .hz-s, .hz.l4 .hz-n, .hz.l4 small, .hz.l4 .hz-meta, .hz.l4 .hz-pg, .hz.l4 .hz-s i { color: var(--on-good); }
.hz.prog { border: 1.5px dashed var(--c-prof); }
.hz.off { opacity: .45; background: transparent; border-style: dashed; }
.hz .stale { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--surface); }
.hzgrid.all { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.hzgrid.all .hz { padding: 6px 2px 5px; border-radius: 10px; align-items: center; }
.hzgrid.all .hz-s { font-size: 15px; }
.hzgrid.all .hz-s small, .hzgrid.all .hz-meta, .hzgrid.all .hz-pg, .hzgrid.all .hz-s i { display: none; }
.hzgrid.all .stale { top: 4px; right: 4px; width: 6px; height: 6px; }
.tah { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border-radius: 16px; text-align: left; background: color-mix(in srgb, var(--gold) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); }
.tah .tah-disc { position: static; width: 52px; height: 52px; flex: none; }
.tah-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tah-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--muted); }
.tah-h .ar-t { font-family: var(--f-ar); font-size: 19px; font-weight: 700; line-height: 1.3; color: var(--gold); }
.tah small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tah small.main { color: var(--fg); font-weight: 600; font-size: 12.5px; }
.tah-bar { height: 4px; border-radius: 9px; background: var(--surface-2); overflow: hidden; margin-block: 2px; }
.tah-bar i { display: block; height: 100%; background: var(--gold); border-radius: inherit; }

/* Sheets */
.backdrop { position: fixed; inset: 0; z-index: 30; background: var(--backdrop); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet {
  width: 100%; max-width: 560px; max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
  padding-top: 10px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: rise .24s cubic-bezier(.2,.8,.2,1);
}
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); align-self: center; flex: none; }
.sheet h2 { font-size: 21px; font-weight: 800; }
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sh-head > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sh-ar { font-family: var(--f-ar); font-size: 32px; font-weight: 700; line-height: 1.3; color: var(--gold); }
.field { display: flex; flex-direction: column; gap: 7px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field > span, .field legend, .flabel { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0; }
.field legend { margin-bottom: 7px; }
.input { height: 46px; width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 12px; font: inherit; font-size: 16px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea.input { height: auto; min-height: 92px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { min-height: 40px; padding: 0 13px; border-radius: 11px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); background: var(--surface); }
.opt[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.opt .ar { font-size: 17px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .input, .stepper .val { text-align: center; font-family: var(--f-display); font-weight: 650; font-size: 18px; min-width: 0; flex: 1; }
.stepper .val { height: 46px; display: grid; place-items: center; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.stepper button { width: 42px; height: 46px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 600; }
.prev { margin: 0; font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.prev .ar { font-size: 20px; color: var(--fg); font-weight: 700; }
.btn.wide { width: 100%; margin-top: 12px; }
.onb-card > p.grp.mig-q { font-size: 19px; margin-top: 6px; }
.defs { display: flex; flex-direction: column; gap: 8px; }
.def { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; font: inherit; }
.def b { font-size: 15.5px; } .def small { font-size: 13px; color: var(--muted); line-height: 1.4; }
.def[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.grp .nat, .goal-top .nat { font-size: 12px; color: var(--muted); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: 0; }
.ptiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ptiles.one { grid-template-columns: 1fr; }
.ptile { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; min-height: 128px; font: inherit; }
.ptile .pt-l { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ptile .ar { flex: 1; display: flex; align-items: center; justify-content: flex-end; text-align: right; font-size: 20px; font-weight: 700; line-height: 1.5; }
.ptile small { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.ptile .pt-go { font-size: 12.5px; font-weight: 650; color: var(--accent); margin-top: 2px; }
.ptile.on, .ptile[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.grp2 { margin: 4px 0 -6px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tl-h { margin: -4px 0 0; }
.goal-top .nat { font-size: 12px; color: var(--muted); font-style: italic; }
.row-sv { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 8px; }
.row-sv.lbl { margin-bottom: -2px; } .row-sv.lbl small { font-size: 11.5px; color: var(--muted); padding-left: 4px; }
.row-sv.lbl small:last-child { text-align: center; padding-left: 0; }
.row-sv select.input { min-height: 48px; font-size: 16px; }
.vnum { min-height: 48px; text-align: center; font-family: var(--f-display); font-weight: 650; font-size: 20px; }
.vstart { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.vstart .ar { align-self: stretch; text-align: right; font-size: 20px; font-weight: 700; }
.opt.fin { align-self: flex-start; }
.slist { display: flex; flex-direction: column; gap: 6px; max-height: 330px; overflow-y: auto; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.srow .ar { order: 2; font-size: 18px; font-weight: 700; }
.srow small { color: var(--muted); font-size: 12px; text-align: left; }
.srow[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.ggroup-h small { margin-left: auto; font-size: 12px; color: var(--muted); }
.kgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.kgrid button { min-height: 38px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.kgrid button[aria-pressed="true"] { border: 1px solid var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.kgrid button.lk { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); opacity: .75; }
.kgrid button.cur { border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); }
.kgrid button:disabled { cursor: default; }
.krange { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.krange .input { width: 64px; min-height: 40px; padding: 0 8px; text-align: center; }
.krange .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }
.klegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.klegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.klegend .k1 { background: var(--surface-2); border: 1px solid var(--line); }
.klegend .k2 { border: 1.5px solid var(--accent); }
.klegend .k3 { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border: 1px solid var(--accent); }
.ggroup { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); }
.ggroup.off { opacity: .55; }
.ggroup-h { display: flex; align-items: center; gap: 10px; }
.ggroup-h .ar { font-size: 22px; font-weight: 700; flex: 1; }
.tick { width: 34px; height: 34px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--on-good); }
.tick svg { width: 18px; height: 18px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.switch-row:first-of-type { border-top: 0; }
.switch-row > div { min-width: 0; display: flex; flex-direction: column; }
.switch-row small { color: var(--muted); font-size: 12.5px; }
.switch { width: 50px; height: 30px; flex: none; border-radius: 99px; border: 0; background: var(--surface-2); position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { left: 23px; }
.set-list { display: flex; flex-direction: column; gap: 8px; }
.set-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.set-item > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.set-item small { color: var(--muted); font-size: 12.5px; }
.set-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.hist li:first-child { border-top: 0; }
.hist li span { flex: 1; min-width: 0; color: var(--muted); }
.hist li b { min-width: 44px; font-variant-numeric: tabular-nums; }
.hist button { border: 0; background: none; color: var(--muted); font-size: 18px; width: 34px; height: 34px; border-radius: 8px; flex: none; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats3 > div { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats3 span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.stats3 b { font-family: var(--f-display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stats3 small { font-size: 12px; color: var(--muted); }

/* Onboarding */
.onb { max-width: 520px; margin: 0 auto; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.onb-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding-top: 6px; }
.onb-hero img { width: 76px; height: 76px; border-radius: 18px; box-shadow: var(--shadow); }
.hero-sep { width: 1.5px; height: 18px; border-radius: 2px; background: var(--muted); opacity: .5; }
.onb-hero p.hero-q { font-size: 12.5px; color: var(--muted); line-height: 1.6; max-width: 34ch; }
.hero-q .ar { font-size: 15.5px; font-weight: 700; color: inherit; }
.hero-ref { white-space: nowrap; font-size: 11.5px; opacity: .85; }
.quote { margin: 4px 0 0; padding: 12px 16px; border-radius: 16px; background: color-mix(in srgb, var(--gold) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--line)); display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 340px; }
.quote blockquote { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.quote blockquote p { margin: 0; }
.quote .ar { font-size: 23px; font-weight: 700; line-height: 1.6; color: var(--gold); }
.quote .fr-q { font-family: var(--f-body); font-style: italic; font-size: 14.5px; color: var(--fg); }
.quote figcaption { font-size: 11.5px; letter-spacing: .04em; color: var(--muted); }
.onb-hero p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 36ch; }
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
.steps i.on { background: var(--gold); }
.steps-l { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 12px; color: var(--muted); }
.steps-l b { color: var(--fg); }
.onb-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.onb-card h2 { font-size: 22px; font-weight: 800; text-wrap: balance; }
.onb-card > p { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
.choice { display: flex; flex-direction: column; gap: 8px; }
.choice button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.choice button small { color: var(--muted); font-size: 12.5px; }
.choice button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent); }
.onb-nav { display: flex; gap: 8px; }
.onb-nav .btn { flex: 1; }
.err { margin: 0; font-size: 13px; color: var(--danger); }
.onb-card > p.grp { margin: 6px 0 -6px; font-weight: 700; font-size: 15.5px; color: var(--fg); padding-top: 12px; border-top: 1px solid var(--line); }
.onb-card > p.grp:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.recap { display: flex; flex-direction: column; }
.recap div { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.recap div:first-child { border-top: 0; }
.recap dt { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; color: var(--muted); }
.recap dd { margin: 0; font-size: 14px; font-weight: 600; }
.recap .rc { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.rules li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.rules li b { display: block; }
.rules li span.n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 18%, var(--surface)); color: var(--gold); font-weight: 800; font-size: 13px; }
.foot { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 370px) { .grow { grid-template-columns: minmax(0, 1fr) repeat(7, 24px); gap: 3px; } .cell { width: 24px; height: 24px; } .row2 { grid-template-columns: 1fr; } }
/* vendredi */
h1.fri { color: var(--gold); }
.jum-q { margin: 6px 0 0; text-align: left; line-height: 1.7; letter-spacing: 0; }
.jum-q .ar { font-family: 'Amiri', serif; font-size: 12.5px; color: var(--fg); opacity: .8; }
.jum-q .q-ref { margin-left: 6px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.day.fri .wd { color: var(--gold); }
.hadith { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 16px 12px; border-radius: 20px; text-align: center; background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--gold) 13%, var(--surface)) 0%, var(--surface) 70%); border: 1px solid color-mix(in srgb, var(--gold) 38%, var(--line)); }
.had-l { display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.had-l::before, .had-l::after { content: ''; width: 18px; height: 1px; background: currentColor; opacity: .6; }
.had-ar { margin: 0; font-family: 'Amiri', serif; font-size: 16.5px; line-height: 1.85; color: var(--fg); text-wrap: balance; }
.had-fr { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--fg); opacity: .78; font-style: italic; text-wrap: pretty; }
.had-foot { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--gold) 25%, var(--line)); }
.had-ref { font-size: 11px; color: var(--muted); text-align: left; }
.had-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--gold); background: transparent; color: var(--fg); font-size: 13px; font-weight: 600; }
.had-btn svg { width: 14px; height: 14px; color: var(--gold); }
.had-mini { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 14px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--gold) 38%, var(--line)); background: var(--surface); color: var(--fg); font-size: 13px; text-align: left; }
.had-mini svg { width: 15px; height: 15px; color: var(--gold); flex: none; }
.had-mini span { flex: 1; }
.had-mini b { color: var(--accent); font-weight: 600; }
.banner.kask { flex-direction: column; align-items: stretch; gap: 10px; border-color: var(--gold); line-height: 1.45; }
.kask-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.kask-acts .btn { flex: 1 1 40%; }
/* navigateurs sans color-mix (anciens Samsung Internet, Android WebView) : couleurs pleines ou bordures à la place des teintes */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  .goal.full { border-color: var(--good); } .goal.low { border-color: var(--danger); } .goal.ok { border-color: var(--warn); }
  .banner.warn { border-color: var(--warn); }
  .cell.ok, .mc.ok, .legend i.o { background: var(--warn); color: #fff; }
  .cell.low, .mc.low, .legend i.l { background: var(--danger); color: #fff; }
  .cell.soft { background: var(--cat); color: #fff; opacity: .7; }
  .legend i.z3 { background: var(--good); opacity: .6; }
  .hz.l1 { border: 2px solid var(--danger); } .hz.l2 { border: 2px solid var(--warn); } .hz.l3 { border: 2px solid var(--good); }
  .pchip.l1 { border-color: var(--danger); } .pchip.l2 { border-color: var(--warn); }
  .ctrl .inc, .btn.soft { border-color: var(--cat); }
  .btn.danger { border-color: var(--danger); }
  .opt[aria-pressed="true"], .choice button[aria-pressed="true"], .kgrid button[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--surface-2); }
  .klegend .k3 { background: var(--surface-2); border: 2px solid var(--accent); }
  .tah, .quote, .hadith, .had-mini { background: var(--surface); border-color: var(--gold); }
  .had-foot { border-color: var(--line); }
  .rules li span.n { background: var(--surface-2); }
  .win svg { background: rgba(255, 255, 255, .2); }
}
</style>

/* ---------- dates & formats ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const weekStart = k => { const d = parseKey(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); };
const weekDays = k => { const s = weekStart(k); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); };

function revCard(k, future) {

    const por = lg.h ? portion(prog8(k), lg.h) : null;
    const items = (lg.rh || []).map(h => { const ev = hzEvals(h).find(x => x.d === k && x.src === 'cheikh'); return `<span class="pitem"><span class="ar" lang="ar">حزب ${h}</span>${ev ? `<em class="${lvl(ev.s)}-t">${ev.s}/10</em>` : ''}</span>`; }).join('');
    body = `${por ? `<div class="hz-now"><span class="ar" lang="ar">${por.ar}</span><small>${isK1() ? 'Récité' : 'Repassé'} : ${UNITS.find(x => x[0] === lg.h) ? UNITS.find(x => x[0] === lg.h)[2] : lg.h + '/8 de hizb'}</small></div>` : '<div class="hz-now"><small>Pas de nouvelle partie récitée ce jour-là.</small></div>'}
      ${items ? `<div class="sub"><b>Révisé avec le cheikh</b><div class="plist">${items}</div></div>` : ''}
      <div class="acts"><button type="button" class="btn" data-act="pass-open">Modifier le passage</button></div>`;
  } else {
    body = `<h3>${future ? 'À préparer' : 'Au programme'}</h3>${future ? '' : '<p class="hint tl-h">Touche ce que tu as fait avec le cheikh.</p>'}${prepBlock(k, !future)}${future || passTiles(k, null, false) ? '' : `<div class="acts"><button type="button" class="btn validate" data-act="pass-open">${ICON_CHECK} J'ai eu mon passage</button></div>`}
      ${mode === 'fixed' && k >= t ? `<button type="button" class="link" data-act="move-open">Décaler ce passage cette semaine</button>` : ''}`;
  }
  return `<article class="goal ${st}" style="--cat:var(--c-prof)"><div class="goal-top"><span class="chip">Passage avec le cheikh</span>${tag}</div>${body}</article>`;
}

function wirdCard(k, future) {
  const w = C().wird, v = wirdOf(k), step = w.unit === 'hizb' ? 0.5 : 1, unit = w.unit === 'hizb' ? 'hizb' : 'pages';
  const paused = inPause(k, 'wird'), counts = k >= wirdFrom(), done = v >= w.qty;
  const tag = paused ? '<span class="tag">En pause</span>' : done ? '<span class="tag good">Validé</span>' : v ? '<span class="tag warn">En cours</span>' : future ? '<span class="tag">Prévu</span>' : counts ? `<span class="tag red">${k < todayKey() ? 'Non fait' : 'À valider'}</span>` : '';
  const st = done ? 'full' : paused || future || !counts ? '' : v ? 'ok' : 'low';
  return `<article class="goal ${st}" style="--cat:var(--c-wird)"><div class="goal-top"><span class="chip">Wird</span><small class="nat">lecture</small>${tag}</div>
    <div class="bar"><i style="width:${Math.min(v / w.qty, 1) * 100}%"></i></div>
    <div class="goal-foot"><p class="meta"><b>${frQ(v)}</b> / ${frQ(w.qty)} ${unit}</p><div class="ctrl">
      <button type="button" data-act="w-dec" aria-label="Retirer ${step}" ${future || !v ? 'disabled' : ''}>−</button>
      <button type="button" class="inc" data-act="w-inc" aria-label="Ajouter ${step}" ${future ? 'disabled' : ''}>+${step === 0.5 ? '½' : 1}</button>
      <button type="button" class="check" data-act="w-full" aria-pressed="${done}" aria-label="${done ? 'Remettre à zéro' : 'Tout valider'}" ${future ? 'disabled' : ''}>${ICON_CHECK}</button></div></div></article>`;
}

/* ---------- vendredi : hadith, Al-Kahf ---------- */
function hadithCard(k) {
  if (S.meta.hadRead === k && V.hadOpen !== k) return `<button type="button" class="had-mini" data-act="had-open">${ICON_CHECK}<span>Hadith du vendredi lu</span><b>Relire</b></button>`;

    <span class="had-l">Rappel du vendredi</span>
    <p class="had-ar" lang="ar" dir="rtl">قال رسول الله ﷺ : « مَن تَوضَّأَ فأحسنَ الوضوءَ ثمَّ أتَى الجمُعةَ فدَنا وأنصتَ واستمعَ غُفِرَ لَهُ ما بينَهُ وبينَ الجُمعةِ الأُخرَى وزِيادةُ ثلاثةِ أيَّامٍ، ومَن مسَّ الحصَى فقَد لَغا »</p>
    <p class="had-fr">« Celui qui fait ses ablutions en les accomplissant parfaitement, puis vient à la prière du vendredi, s'approche, se tait et écoute, il lui est pardonné ce qui est entre ce vendredi et le suivant, avec trois jours de plus. Et celui qui touche les cailloux a commis une futilité. »</p>
    <div class="had-foot"><span class="had-ref">D'après Abou Hourayra · rapporté par Muslim</span>${read ? `<button type="button" class="had-btn" data-act="had-close">Refermer</button>` : `<button type="button" class="had-btn" data-act="had-read">${ICON_CHECK} J'ai lu</button>`}</div>
  </article>`;
}
function kahfAsk() {
  return `<div class="banner kask"><div><b>Sourate Al-Kahf chaque vendredi ?</b>Ajoute-la à ton suivi du vendredi. Tu peux la compter comme objectif du jour, ou en bonus, sans rouge.</div>
    <div class="kask-acts"><button type="button" class="btn primary" data-act="kahf-set" data-v="obj">Oui, en objectif</button><button type="button" class="btn" data-act="kahf-set" data-v="bonus">Oui, en bonus</button><button type="button" class="link" data-act="kahf-set" data-v="no">Non merci</button></div></div>`;
}
function kahfCard(k, future) {
  const done = !!(S.log[k] && S.log[k].kahf), obj = C().kahf.mode === 'obj', t = todayKey();
  const tag = future ? '<span class="tag">À venir</span>' : done ? '<span class="tag good">Lue, بارك الله فيك</span>' : obj && k < t ? '<span class="tag red">Pas lue</span>' : obj ? '<span class="tag red">À lire</span>' : '<span class="tag">Bonus</span>';
  return `<article class="goal ${done ? 'full' : obj && !future ? 'low' : ''}" style="--cat:var(--gold)"><div class="goal-top"><span class="chip">Vendredi</span>${tag}</div>
    <div class="hz-now"><span class="ar" lang="ar">سورة الكهف</span><small>Sourate Al-Kahf · ${obj ? 'objectif du vendredi' : 'bonus, sans rouge'}</small></div>
    <div class="acts"><button type="button" class="btn ${done ? '' : 'validate'}" data-act="kahf-done" ${future ? 'disabled' : ''}>${done ? 'Annuler' : ICON_CHECK + ' Je l\'ai lue'}</button></div></article>`;
}

/* ---------- Semaine ---------- */
function weekView() {
  const k = V.sel, t = todayKey(), days = weekDays(k), c = C(), ws = weekScore(k);
  const rows = [], lines = [];
  if (c.rev.on) {
    const ds = days.filter(d => d <= t && d >= c.created && !inPause(d, 'rev') && poolHz(d) > 0);
    const full = ds.filter(d => revCount(d) >= revTarget(d)).length, sum = days.reduce((a, d) => a + revCount(d), 0);
    lines.push(`<p>Révision : ${full} jour${full > 1 ? 's' : ''} sur ${ds.length} · ${hizbFr(sum)}</p>`);
    rows.push(`<div class="grow" style="--cat:var(--c-rev)"><div class="gname"><span>Révision perso</span><small>${esc(hizbFr(revTarget(t)))} / jour</small></div>${days.map(d => {
      const st = d > t ? 'future' : inPause(d, 'rev') ? 'pause' : d < c.created || !poolHz(d) || (isTahDay(d) && tahOf(d) !== -1 && !revCount(d)) ? 'na' : revCount(d) >= revTarget(d) ? 'full' : revCount(d) ? 'ok' : 'low';
      return `<button type="button" class="cell ${st}${d === k ? ' sel' : ''}" data-act="goday" data-day="${d}" aria-label="Révision, ${esc(fmtLong.format(parseKey(d)))}">${st === 'full' ? '✓' : revCount(d) || (st === 'na' || st === 'pause' ? '·' : '')}</button>`; }).join('')}</div>`);
  }
  if (c.pass.on) {
    const n = days.filter(passOf).length;
    const target = c.pass.mode === 'fixed' ? days.filter(isPassDay).length : c.pass.mode === 'quota' ? c.pass.perWeek : null;
    lines.push(`<p>Passages : ${n}${target != null ? ` sur ${target}` : ''}${c.pass.mode === 'month' ? ` · ${monthDays(k).filter(passOf).length} / ${c.pass.perMonth} ce mois` : ''}</p>`);
    rows.push(`<div class="grow" style="--cat:var(--c-prof)"><div class="gname"><span>Passages</span><small>${c.pass.mode === 'fixed' ? esc(DOW_ORDER.filter(x => c.pass.days.includes(x)).map(x => DOW[x]).join(', ')) : c.pass.mode === 'quota' ? `${c.pass.perWeek} / semaine` : `${c.pass.perMonth} min. / mois`}</small></div>${days.map(d => {
      const sched = isPassDay(d), done = !!passOf(d);
      const st = done ? 'full' : d > t ? (sched ? 'future' : 'na') : inPause(d, 'pass') ? 'pause' : sched ? 'low' : 'na';
      return `<button type="button" class="cell ${st}${d === k ? ' sel' : ''}" data-act="goday" data-day="${d}" aria-label="Passage, ${esc(fmtLong.format(parseKey(d)))}">${done ? '✓' : st === 'na' || st === 'pause' ? '·' : ''}</button>`; }).join('')}</div>`);
  }
  if (c.wird.on) {
    const n = days.filter(d => S.log[d] && S.log[d].w).length;
    lines.push(`<p>Wird : ${n} jour${n > 1 ? 's' : ''} de lecture</p>`);
    rows.push(`<div class="grow" style="--cat:var(--c-wird)"><div class="gname"><span>Wird</span><small>chaque jour</small></div>${days.map(d => {
      const v = wirdOf(d), st = v >= c.wird.qty ? 'full' : d > t ? 'future' : inPause(d, 'wird') ? 'pause' : d < wirdFrom() ? (v ? 'soft' : 'na') : v ? 'ok' : 'low';
      return `<button type="button" class="cell ${st}${d === k ? ' sel' : ''}" data-act="goday" data-day="${d}" aria-label="Wird, ${esc(fmtLong.format(parseKey(d)))}">${st === 'full' ? '✓' : v ? frQ(v) : st === 'na' || st === 'pause' ? '·' : ''}</button>`; }).join('')}</div>`);
  }
  if (days.some(isTahDay)) {
    const td = days.find(isTahDay), tv = tahOf(td);
    lines.unshift(`<p>${AR('تعاهدوا')} : ${td > t ? 'à venir' : tv === 1 ? 'fait' : tv === -1 ? 'pas fait' : 'à valider'}</p>`);
    rows.unshift(`<div class="grow" style="--cat:var(--gold)"><div class="gname"><span>تعاهدوا</span><small>récitation complète</small></div>${days.map(d => { const tdd = isTahDay(d), v = tahOf(d); const st = !tdd ? 'na' : d > t ? 'future' : v === 1 ? 'full' : v === -1 ? 'na' : 'low'; return `<button type="button" class="cell ${st}${d === k ? ' sel' : ''}" data-act="goday" data-day="${d}" aria-label="تعاهدوا, ${esc(fmtLong.format(parseKey(d)))}">${st === 'full' ? '✓' : tdd && v === -1 ? '–' : !tdd ? '·' : ''}</button>`; }).join('')}</div>`);
  }
  return `<div class="summary"><div class="ring ${ws >= 1 ? 'full' : ''}">${ringSvg(ws, 72, 7, ws >= 1 ? 'var(--good)' : 'var(--accent)')}<span>${pct(ws)}</span></div>
    <div><h2>Semaine ${isoWeek(k)}</h2>${lines.join('')}<p class="small">Chaque objectif compte autant.</p></div></div>
    <section><div class="sec-head"><h2>Jour par jour</h2><span>Touche une case pour ouvrir le jour</span></div>
    <div class="grid"><div class="grow head"><span></span>${WD.map(x => `<span>${x}</span>`).join('')}</div>${rows.join('')}
    <div class="legend"><span><i class="l"></i>Sous le minimum</span><span><i class="o"></i>Commencé</span><span><i class="f"></i>Atteint</span></div></div></section>`;
}

/* ---------- Mois ---------- */
function monthView() {
  const k = V.sel, t = todayKey(), days = monthDays(k), c = C(), past = days.filter(d => d <= t && d >= c.created);
  let good = 0, low = 0;
  past.forEach(d => { const s = dayStatus(d); if (s === 'low') low++; else if (s === 'full' || s === 'ok') good++; });
  const offset = (parseKey(days[0]).getDay() + 6) % 7;
  const cal = `<div class="cal">${WD.map(x => `<span class="h">${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${days.map(d => {
    const s = d > t ? 'future' : (dayStatus(d) || '');
    return `<button type="button" class="mc ${s}${d === t ? ' today' : ''}${d === k ? ' sel' : ''}" data-act="goday" data-day="${d}" aria-label="${esc(cap(fmtLong.format(parseKey(d))))}">${parseKey(d).getDate()}</button>`; }).join('')}</div>`;
  const stats = [];
  if (c.rev.on) { const sum = days.reduce((a, d) => a + revCount(d), 0); stats.push(`<div class="stat" style="--cat:var(--c-rev)"><span>Révision perso</span><b>${hizbFr(sum).replace(' hizb', '')}</b><small>hizb révisés ce mois</small></div>`); }
  if (c.pass.on) { const n = days.filter(passOf).length; stats.push(`<div class="stat" style="--cat:var(--c-prof)"><span>Passages</span><b>${n}${c.pass.mode === 'month' ? `<small> / ${c.pass.perMonth}</small>` : ''}</b><small>${c.pass.mode === 'month' ? (n >= c.pass.perMonth ? 'objectif du mois atteint' : 'minimum du mois') : 'avec le cheikh'}</small></div>`); }
  const hif = days.reduce((a, d) => a + ((S.log[d] && S.log[d].pass && S.log[d].pass.h) || 0), 0);
  stats.push(`<div class="stat" style="--cat:var(--gold)"><span>${isK1() ? 'Hifz' : 'Khatma repassée'}</span><b>${fr(hif / 8)}</b><small>hizb ${isK1() ? 'appris' : 'repassés'} ce mois</small></div>`);
  if (c.wird.on) { const n = days.filter(d => S.log[d] && S.log[d].w).length; stats.push(`<div class="stat" style="--cat:var(--c-wird)"><span>Wird</span><b>${n}</b><small>jours de lecture</small></div>`); }
  return `<div class="month-nav"><button type="button" class="nav-btn" data-act="prevMonth" aria-label="Mois précédent">${ICON_PREV}</button><h2>${esc(cap(fmtMonth.format(parseKey(k))))}</h2><button type="button" class="nav-btn" data-act="nextMonth" aria-label="Mois suivant">${ICON_CHEV}</button></div>
    <div class="summary"><div class="ring">${ringSvg(past.length ? good / past.length : null, 72, 7, 'var(--good)')}<span>${past.length ? good : '—'}</span></div><div><h2>Ton mois</h2><p>${good} jour${good > 1 ? 's' : ''} au-dessus du minimum</p>${low ? `<p class="red">${low} jour${low > 1 ? 's' : ''} en rouge</p>` : ''}</div></div>
    ${cal}<div class="stats4">${stats.join('')}</div>`;
}

/* ---------- Hizb ---------- */
function tahBanner() {
  const tn = tahNext(); if (!tn) return '';
  const { next, n } = tn, N = tahGoal(next);
  let lines;
  if (N) {
    const P = tahPlan(N, n), bits = [];
    if (P.avg != null) bits.push(`moyenne <b class="${lvl(P.avg)}-t">${fr(P.avg)}/10</b>${P.rated < P.known ? ` (${P.rated}/${P.known} notés)` : ''}`);
    bits.push(P.remain8 ? `reste ${fmtLearned(P.remain8)} à apprendre${n ? `, ≈ ${fr(P.perWeek)} ${AR('ثمن')}/sem` : ''}` : 'tout est appris');
    lines = `<small class="main">Objectif ${N} hizb · ${fr(Math.min(P.L, N * 8) / 8)} / ${N} prêts</small><span class="tah-bar"><i style="width:${P.prog * 100}%"></i></span><small>${bits.join(' · ')}</small>`;
  } else lines = `<small class="main">${isK1() ? fmtLearned(learned8()) : '60 hizb'} à réciter d'un coup</small><small>Touche pour fixer ton objectif</small>`;
  return `<button type="button" class="tah" data-act="tah-open"><span class="tah-disc">${n === 0 ? ICON_CHECK : `<b>${n}</b>`}<small lang="ar">تعاهدوا</small></span><span class="tah-l"><span class="tah-h"><span class="ar-t" lang="ar">تَعَاهَدُوا</span>${n === 0 ? "aujourd'hui" : esc(cap(fmtLong.format(parseKey(next))))}</span>${lines}</span></button>`;
}
function hizbView() {
  const dir = C().dir, L8 = learned8(), learned = poolList(), t = todayKey(), e8 = prog8(), vcov = vmOn() && isK1() ? vmCov() : null;
  const prog = vcov ? null : isK1() && e8 % 8 ? curHifz() : null;
  const part = h => vcov ? vcov[h - 1] > 0.03 && vcov[h - 1] < FULL : h === prog;
  const seen = hzSeen(), cyc = cycleDays();
  const rated = learned.filter(h => hzScore(h) != null), avg = rated.length ? mean(rated.map(hzScore)) : null;
  const weakN = rated.filter(h => hzScore(h) < 6.5).length, unrated = learned.length - rated.length;
  const stale = h => { const s = seen[h]; return !!(cyc && s && daysBetween(s.last, t) > cyc + 7); };
  const prio = learned.filter(h => (hzScore(h) != null && hzScore(h) < 6.5) || stale(h)).sort((a, b) => (hzScore(a) ?? 11) - (hzScore(b) ?? 11)).slice(0, 5);
  const showAll = !isK1() || V.hzAll;
  const order = showAll ? order60(dir) : order60(dir).filter(h => part(h) || learned.includes(h));
  const compact = showAll;
  const tile = h => {
    const isL = learned.includes(h), isP = part(h), s = hzScore(h), pv = hzPrevScore(h), sn = seen[h], npts = (hzRec(h).pts || []).length;
    const cls = ['hz', isL || isP ? lvl(s) : 'off', isP && 'prog'].filter(Boolean).join(' ');
    const trend = s != null && pv != null && Math.abs(s - pv) >= 0.5 ? (s > pv ? '<i class="up">↑</i>' : '<i class="down">↓</i>') : '';
    const days = sn ? daysBetween(sn.last, t) : null;
    const meta = isP ? (vcov ? `En cours · ${Math.round(vcov[h - 1] * 100)} %` : `En cours · ${e8 % 8}/8`) : !isL ? 'Pas encore appris' : sn ? (days === 0 ? "Révisé aujourd'hui" : `Révisé il y a ${days} j`) : 'Pas encore révisé';
    return `<button type="button" class="${cls}" data-act="hz-open" data-hz="${h}" ${isL || isP ? '' : 'disabled'} aria-label="Hizb ${h}, ${s != null ? fr(s) + ' sur 10' : 'pas encore noté'}">${stale(h) ? '<span class="stale"></span>' : ''}<span class="hz-n">${compact ? h : 'Hizb ' + h}</span>${s != null ? `<span class="hz-s">${fr(s)}<small>/10</small>${trend}</span>` : `<span class="hz-s hz-empty">${compact ? '·' : 'À noter'}</span>`}<span class="hz-meta">${meta}</span>${npts ? `<span class="hz-pg">${npts} point${npts > 1 ? 's' : ''} à revoir</span>` : ''}</button>`;
  };
  const ringCol = avg == null ? 'var(--accent)' : avg >= 6.5 ? 'var(--good)' : avg >= 4.5 ? 'var(--warn)' : 'var(--danger)';
  return `${tahBanner()}<div class="summary"><div class="ring">${ringSvg(avg == null ? null : avg / 10, 72, 7, ringCol)}<span style="color:${ringCol}">${avg == null ? '—' : fr(avg)}</span></div>
      <div><h2>Carte des hizb</h2><p>${isK1() ? fmtLearned(L8) + ' appris' : '60 hizb'}${avg != null ? ` · moyenne ${fr(avg)}/10` : ''}</p>${weakN ? `<p class="red">${weakN} hizb à renforcer</p>` : ''}${unrated ? `<p class="small">${unrated} pas encore noté${unrated > 1 ? 's' : ''}</p>` : ''}</div></div>
    ${prio.length ? `<section><div class="sec-head"><h2>À renforcer en priorité</h2></div><div class="prio">${prio.map(h => `<button type="button" class="pchip ${lvl(hzScore(h))}" data-act="hz-open" data-hz="${h}"><span class="ar" lang="ar">حزب ${h}</span><b>${hzScore(h) != null ? fr(hzScore(h)) : '–'}/10</b>${stale(h) ? '<small>Pas révisé depuis longtemps</small>' : ''}</button>`).join('')}</div></section>` : ''}
    <section><div class="sec-head"><h2>${showAll ? 'Les 60 hizb' : 'Mes hizb'}</h2>${isK1() ? `<div class="mini-seg" role="group" aria-label="Affichage"><button type="button" data-act="hz-all" data-v="0" aria-pressed="${!V.hzAll}">Appris</button><button type="button" data-act="hz-all" data-v="1" aria-pressed="${!!V.hzAll}">Les 60</button></div>` : ''}</div>
      <div class="hzgrid${showAll ? ' all' : ''}">${order.map(tile).join('')}</div>
      <div class="legend"><span><i class="z1"></i>à revoir</span><span><i class="z2"></i>fragile</span><span><i class="z3"></i>bon</span><span><i class="z4"></i>solide</span>${cyc ? '<span><i class="zs"></i>pas révisé depuis longtemps</span>' : ''}</div>
      <p class="hint">La note d'un hizb est la moyenne de ses 3 dernières notes. Touche un hizb pour le noter ou ajouter des points à revoir.</p>
      ${isK1() ? `<button type="button" class="btn soft wide" data-act="kn-open">+ Ajouter des hizb déjà appris</button>` : ''}</section>`;
}

/* ================= SUIVI PAR SOURATE ET VERSET (sens 60 → 1) =================
